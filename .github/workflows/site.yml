name: Validate, build and deploy

# Standalone SGSSL_Webpage repository. Validate the setup pull request;
# production uploads stay disabled until DEPLOY_ENABLED is explicitly true.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize build and deployment together so a slower old build cannot overtake
# a newer production build. Never cancel a deployment partway through promotion.
concurrency:
  group: sgssl-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_CMS_URL: ${{ vars.PUBLIC_CMS_URL }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-${{ github.sha }}
          path: dist/
          digest-mismatch: error
      - name: Refuse obsolete production builds
        run: node scripts/check-deploy-head.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload the successful build over verified SFTP
        run: node scripts/deploy.mjs
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          SITE_URL: ${{ vars.SITE_URL }}
          SFTP_HOST: ${{ vars.SFTP_HOST }}
          SFTP_PORT: ${{ vars.SFTP_PORT }}
          SFTP_REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST_KEY_SHA256: ${{ secrets.SFTP_HOST_KEY_SHA256 }}
